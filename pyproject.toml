[project]
name = "Sprint_10_UI"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest==2.13.5",
    "allure-python-commons==2.13.5",
    "pytest==9.0.2",
    "pytest-xdist==3.8.0",
    "selenium==4.18.1",
    "webdriver-manager==4.0.1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
markers = [
    "UI: UI тесты",
    "smoke: Smoke тесты",
    "regress: Regress тесты",
    "taxi: Тесты такси",
    "routes: Тесты маршрутов",
    "blocker: Allure severity",
    "critical: Allure severity",
    "normal: Allure severity",
    "minor: Allure severity",
    "trivial: Allure severity",
]

disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
addopts = "-n auto --alluredir=allure-result"